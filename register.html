<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - MyShop</title>
    <link rel = "stylesheet" href = "./assets/css/style.css" />
    <link 
        rel = "stylesheet"
        href = "https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
</head>
<body>
    <main class = "auth-container">
        <div class = "auth-card">
            <div class = "aut-header">
                <h2>Create Account</h2>
                <p>Join us and start shopping today</p>
            </div>

            <form class = "auth-form">
                <div class = "form-group">
                    <label for = "fullname">Full Name</label>
                    <div class = "input-with-icon">
                        <i class = "fas fa-user"></i>
                        <input 
                            type = "text"
                            id = "fullname"
                            placehoder = "Enter your full name"
                            required
                        />
                    </div>
                </div>

                <div class = "form-group">
                    <label for = "email">Email</label>
                    <div class = "input-with-icon">
                        <i class = "fas fa-envelope"></i>
                        <input  
                            type = "email"
                            id = "email"
                            placeholder = "Enter your email address"
                            required
                        />
                    </div>
                </div>

                <div class = "form-group">
                    <label for = "username">Username</label>
                    <div class = "input-with-icon">
                        <i class = "fas fa-user-circle"></i>
                        <input
                            type = "text"
                            id = "username"
                            placehoder = "Choose a username"
                            required
                        />
                    </div>
                </div>

                <div class = "form-group">
                    <label for = "password">Password</label>
                    <div class = "input-with-icon">
                        <i class = "fas fa-lock"></i>
                        <input
                            type = "password"
                            id = "password"
                            placehoder = "Create a password"
                            required
                        />
                        <button
                            type = "button"
                            class = "toggle-password"
                            data-target = "password"
                            title = "Toggle password visibility"
                        >
                            <i class = "fas fa-eye"></i>
                    </button>
                    </div>
                </div>

                <div class = "form-group">
                    <label for = "confirm-password">Confirm Password</label>
                    <div class = "input-with-icon">
                        <i class = "fas fa-lock"></i>
                        <input
                            type = "password"
                            id = "confirm-password"
                            placeholder = "Confirm your password"
                            required
                        />
                        <button
                            type = "button"
                            class = "toggle-password"
                            data-target = "confirm-password"
                            title = "Toggle password visibility"
                        >
                            <i class = "far fa-eye"></i>
                        </button>
                    </div>
                </div>
                <button type = "submit" class = "btn btn-primary btn-block">
                    Create Accout
                </button>

                <div class = "social-login">
                    <p>Or sign up with</p>
                    <div class = "social-icons">
                        <a href = "#" class = "social-icon facebook" title = "FaceBook"
                        ><i class = "fab fa-facebook-f"></i
                    ></a>
                    <a href = "#" class = "social-icon google" title = "Google"
                        ><i class = "fab fa-google"></i
                    ></a>
                    </div>
                </div>

                <div class = "auth-footer">
                    <p>Already have an Account? <a href = "login.html">Sign in</a></p>
                </div>
            </form>
        </div>
    </main>

    <script>
        document.querySelectorAll(".toggle-password").forEach((button) => {
            button.addEventListener("click", function(){
                const targetId = this.getAttribute("data-target");
                const passwordInput = document.getElementById(targetId);
                const icon = this.querySelectorAll("i");

                if (passwordInput.type === "password"){
                    passwordInput.type = "text";
                    icon.classList.remove("fa-eye");
                    icon.classList.add("fa-eye-slash");
                }else{
                    passwordInput.type = "password";
                    icon.classList.remove("fa-eye-slash");
                    icon.classList.add("fa-eye");
                }
            });
        });

        document 
            .querySelector(".auth-form")
            .addEventListener("submit", function(e){
                e.preventDefault();

                const password = document.getElementById("confirm-password").value;
                const confirmPassword =
                    document.getElementById("confirm-password").value;

                if (password !== confirmPassword){
                    alert ("Password do not match!");
                    return;
                }

                if (password.length , 6){
                    alert ("Password must be at least 6 characters long!");
                    return;
                }
                alert ("Registration successful! Redirecting to login...");
            });
    </script>
</body>
</html>
